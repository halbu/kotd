<!DOCTYPE html>
<html lang="en">
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <link rel="stylesheet" href="style.css">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Musical Key</title>
</head>


<body>
    <div class="container">
        <div id="intro">The key of the day is...</div>
        <div id="key-display"></div>
        <div id="date-info"></div>
    </div>

    <div id="output"></div>

    <div>
      <h2> Sample chord progressions: </h2>
      <h3 id="cprog">weed</h3>
    </div>
</body>

<script src="key.js"></script>
<script src="app.js"></script>
<script src="progs.js"></script>
<script>updateDisplay();</script>
<script>vexflowRender();</script>

<script>
  // Get root
  const keyEl = document.getElementById('key-display');
  let myKey = keyEl.textContent;
  if (myKey.endsWith('m')) {
    myKey = myKey.slice(0, -1);
  }
  let chromaticScaleToUse = (myKey.length === 1 || myKey.endsWith('b')) ? flatChrom : sharpChrom;
  let rootIdx = chromaticScaleToUse.indexOf(myKey);
  console.log(`Root index: ${rootIdx}`);

  let cprogstr = chordProgressions[Math.floor(Math.random() * chordProgressions.length)].sequence;
  let chordProg = [];

  // Convert the chords from our random progression into the appropriate key
  for (var i = 0; i != 16; ++i) {
    chordProg.push(romanToChord(cprogstr[i], chromaticScaleToUse));
  }

  let progStr = '';
  let last = '';
  for (var i = 0; i != 16; ++i) {
    if (i === 0) {
      progStr += chordProg[i];
      last = chordProg[i]
    } else {
      if (chordProg[i] !== last) {
        progStr += ' ' + chordProg[i];
        last = chordProg[i]
      } else {
        progStr += ' -';
      }
      if ((i+1) % 4 === 0) {
        progStr += ' |';
      }
    }
  }
  if (progStr.endsWith(' |')) {
    progStr = progStr.slice(0, -2);
  }
  
  const cProgEl = document.getElementById('cprog');
  cProgEl.textContent = progStr;
  console.log(progStr)
  console.log(chordProg.join(', '))

  function romanToChord(r, scale) {
    const add = chordMap[r[0]];
    const newChord = scale[(rootIdx + add) % 12];
    return (newChord + r[1])
  }
</script>

</html>
